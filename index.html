<body>
<header id="topbar">
  <button id="menuBtn" type="button">☰ 選單</button>
  <h1>No. 3 🎨龍騰 B1 L3 Do Animals Sleep like You and Me? 連貫式翻譯課文總複習互動學習網</h1>
</header>
<div id="menuPanel"></div>
<main>
  <section class="panel" id="p-fill"></section>
  <section class="panel" id="p-hunt"></section>
  <section class="panel" id="p-mixed"></section>
  <section class="panel" id="p-trans"></section>
  <section class="panel" id="p-cause"></section>
</main>
<div id="scoreBadge">🏆 累計總分 <span id="scoreVal">0</span>　｜　本輪 <span id="roundVal">0</span>/2000</div>
<div id="toast"></div>
<canvas id="fw"></canvas>
<script>
/* ===== 計分（Kahoot 全站共用，答對 +200／有錯 −50／下限 0／不歸零） ===== */
var TOTAL=0, ROUND=0;
var scoreEl=document.getElementById('scoreVal'), roundEl=document.getElementById('roundVal');
var badgeEl=document.getElementById('scoreBadge');
function addScore(n){
  TOTAL=Math.max(0,TOTAL+n);
  ROUND=Math.max(0,Math.min(2000,ROUND+n));
  scoreEl.textContent=TOTAL; roundEl.textContent=ROUND;
  badgeEl.classList.remove('pop'); void badgeEl.offsetWidth; badgeEl.classList.add('pop');
}
var PRAISE=['🌟 太棒了！你是明日之星！','🎉 完美無瑕，繼續保持！','💎 這實力也太亮眼了吧！','🏆 老師以你為榮！','🍬 甜甜的滿分，收下吧！','🚀 火力全開，衝啊！'];
var ENCOURAGE=['🍬 差一點點，再看一次題目喔！','🌱 沒關係，訂正就是進步的開始！','💪 再試一次，你可以的！','🌤️ 慢慢來，老師陪你一起看！'];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
var toastEl=document.getElementById('toast'), toastTimer=null;
function toast(m,g){toastEl.textContent=m;toastEl.className='on '+(g?'ok':'no');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.className='';},2400);}
/* ===== 煙火 ===== */
var fwc=document.getElementById('fw'), fctx=null, fwParts=[], fwRun=false;
try{fctx=fwc&&fwc.getContext?fwc.getContext('2d'):null;}catch(e){fctx=null;}
function fwResize(){if(!fwc)return;fwc.width=window.innerWidth;fwc.height=window.innerHeight;}
window.addEventListener('resize',fwResize); fwResize();
var MACARON=['#93C5FD','#C4B5FD','#F9A8D4','#FDE68A','#A7F3D0','#5EEAD4'];
function fireworks(){
  if(!fctx)return; fwc.style.display='block'; var waves=0;
  function burst(){
    var cx=fwc.width*(0.2+Math.random()*0.6), cy=fwc.height*(0.18+Math.random()*0.45);
    var col=MACARON[Math.floor(Math.random()*MACARON.length)];
    for(var i=0;i<60;i++){var a=Math.PI*2*i/60,s=2.2+Math.random()*4.6;
      fwParts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:col,r:2+Math.random()*2.4});}
    waves++; if(waves<6) setTimeout(burst,210);
  }
  burst(); if(!fwRun){fwRun=true;fwLoop();}
}
function fwLoop(){
  if(!fctx){fwRun=false;return;}
  fctx.clearRect(0,0,fwc.width,fwc.height);
  for(var i=fwParts.length-1;i>=0;i--){var p=fwParts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.vx*=0.985;p.vy*=0.985;p.life-=0.014;
    if(p.life<=0){fwParts.splice(i,1);continue;}
    fctx.globalAlpha=Math.max(p.life,0);fctx.fillStyle=p.c;
    fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,Math.PI*2);fctx.fill();}
  fctx.globalAlpha=1;
  if(fwParts.length>0){requestAnimationFrame(fwLoop);}else{fwRun=false;fwc.style.display='none';}
}
function celebrate(){fireworks();toast(pick(PRAISE),true);}
/* ===== 朗讀（TTS_OK 保護） ===== */
var TTS_OK=false;
try{if(typeof window!=='undefined'&&typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined'){TTS_OK=true;}}catch(e){TTS_OK=false;}
function say(text){
  if(!TTS_OK){toast('此瀏覽器不支援朗讀功能',false);return;}
  try{
    window.speechSynthesis.cancel();
    var t=String(text).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    var chunks=t.length>140?(t.match(/[^.!?]+[.!?]?/g)||[t]):[t];
    chunks.forEach(function(c){
      var u=new window.SpeechSynthesisUtterance(c.trim());
      u.lang='en-US'; u.rate=0.9; window.speechSynthesis.speak(u);
    });
  }catch(e){toast('此瀏覽器不支援朗讀功能',false);}
}
/* ===== 共用工具 ===== */
function el(t,c,h){var d=document.createElement(t);if(c)d.className=c;if(h!=null)d.innerHTML=h;return d;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function norm(s){return String(s||'').toLowerCase().replace(/[\u2018\u2019\u02BC]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[.,!?;:"()]/g,'').replace(/\s+/g,' ').trim();}
function capOK(u,ans){var a=String(ans).trim(),t=String(u).trim();if(!/^[A-Z]/.test(a))return true;return /^[A-Z]/.test(t);}
function eqWord(a,b){var x=norm(a);if(!x)return false;var alts=String(b).split('/');for(var i=0;i<alts.length;i++){ if(x===norm(alts[i]) && capOK(a,alts[i])) return true; }return false;}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tokens(s){return norm(s).split(' ').filter(Boolean);}
function coverage(ans,ref){
  var A=tokens(ans),R=tokens(ref);
  var stop={a:1,an:1,the:1,is:1,are:1,was:1,were:1,to:1,of:1,in:1,on:1,and:1,it:1,that:1};
  var key=R.filter(function(w){return !stop[w]&&w.length>2;});
  if(!key.length)return 1;
  var hit=0;
  key.forEach(function(w){for(var i=0;i<A.length;i++){if(A[i]===w||(w.length>4&&A[i].indexOf(w.slice(0,Math.max(4,w.length-2)))===0)){hit++;return;}}});
  return hit/key.length;
}
function autofix(s){

  t=t.split(' ').map(function(w){var low=w.toLowerCase().replace(/[.,!?]$/,'');
    if(fix[low])return w.replace(new RegExp(low,'i'),fix[low]);
    if(low==='i')return w.replace(/i/i,'I'); return w;}).join(' ');
  if(t)t=t.charAt(0).toUpperCase()+t.slice(1);
  if(t&&!/[.!?"]$/.test(t))t+='.';
  return t;
}

}

function buildHunt(){

  var paras=[];
  READING.forEach(function(p,idx){
    var st={locked:false}, inputs={};
    var c=el('div','card para'); if(idx>0)c.classList.add('lock');
    c.appendChild(el('div','num','📖 '+p.n));
    var line=el('div','qen');
    var segs=p.en.split(/\{\{\d+\}\}/g);
    var nums=(p.en.match(/\{\{(\d+)\}\}/g)||[]).map(function(m){return parseInt(m.replace(/\D/g,''),10);});
    segs.forEach(function(s,k){
      line.appendChild(document.createTextNode(s));
      if(k<segs.length-1){var n=nums[k];var ip=el('input','blank w1');ip.type='text';
        ip.setAttribute('placeholder','('+n+')');
        ip.setAttribute('autocapitalize','off');ip.setAttribute('autocomplete','off');
        inputs[n]=ip;line.appendChild(ip);}
    });
    c.appendChild(line);
    c.appendChild(el('div','zh','📝 '+p.zh));
    c.appendChild(el('div','lockhint','🔒 完成上一段後即可解鎖本段'));
    var fb=fbBox(), rv=makeReveal();
    var full=buildBlankSentence(p.en,function(n){return p.a[n];});
    var alist=Object.keys(p.a).map(function(n){return n+'. '+p.a[n];}).join('　');
    rv.innerHTML='<div class="ansline">📖 參考解答（Paragraph '+p.n+'）：'+alist+'</div><div class="expl">'+esc(full)+'</div>';
    function unlockNext(){if(paras[idx+1])paras[idx+1].classList.remove('lock');}
    var chk=el('button','btn chk','✅ 檢查本段答案');
    chk.onclick=function(){var ok=true;
      Object.keys(inputs).forEach(function(n){var g=eqWord(inputs[n].value,p.a[n]);inputs[n].className='blank w1 '+(g?'ok':'no');if(!g)ok=false;});
      grade(st,ok,fb,'✅ 本段全部正確！ +200 分','🍬 本段還有空格沒填對，−50 分。'); unlockNext();};
    var rb=revealBtn(rv); rb.addEventListener('click',unlockNext);
    c.appendChild(chk); c.appendChild(rb);
    var sb=el('button','btn say','🔊'); sb.onclick=function(){say(full);};
    c.appendChild(sb); c.appendChild(fb); c.appendChild(rv);
    root.appendChild(c); paras.push(c);
  });
}

    btns.push(b);box.appendChild(b);
  });
  c.appendChild(box);
  var fb=fbBox(),rv=makeReveal();

function copyText(str, fallbackHost){
  var done=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str);done=true;} }catch(e){}
  if(!done){
    try{
      var ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,str.length);
      done=document.execCommand('copy'); document.body.removeChild(ta);
    }catch(e){ done=false; }
  }
  if(done){ toast('已複製本輪練習紀錄，可直接貼到 Google Classroom 留言區！', true); return; }
  if(fallbackHost){
    var box=fallbackHost.querySelector('.copyfall');
    if(!box){ box=el('textarea','ta copyfall'); box.style.minHeight='160px'; fallbackHost.appendChild(box); }
    box.value=str; box.focus(); box.select(); box.setSelectionRange(0,str.length);
    toast('內容已自動全選，直接按 Ctrl+C（Mac 按 ⌘+C）即可複製。', false);
  }else{ toast('請手動選取複製', false); }
}
function downloadText(filename, str){
  try{
    var blob=new Blob(['\ufeff'+str],{type:'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
    toast('已下載練習紀錄檔，可直接上傳 Google Classroom！', true);
  }catch(e){ toast('此瀏覽器無法直接下載，請改用【📋 複製本輪練習】', false); }
}
function downloadWord(filename, title, bodyHtml){
  try{
    var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
      '<head><meta charset="utf-8"><title>'+title+'</title>'+
      '<style>body{font-family:"Microsoft JhengHei","微軟正黑體",sans-serif;line-height:1.9;color:#4A3E3D;font-size:12pt}'+
      'h2{border-bottom:2px solid #7DD3FC;padding-bottom:6px}pre{white-space:pre-wrap;font-family:inherit}'+
      '.sig{margin-top:30px;border-top:1px dashed #999;padding-top:10px}</style></head><body>'+bodyHtml+
      '<div class="sig">班級：____________　座號：____________　姓名：____________　日期：____________</div>'+
      '</body></html>';
    var blob=new Blob(['\ufeff'+html],{type:'application/msword'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
    toast('已下載 Word 檔，可直接上傳 Google Classroom 繳交！', true);
  }catch(e){ toast('此瀏覽器無法直接下載，請改用【👀 預覽本輪紀錄】自行複製', false); }
}
function printView(title, html){
  var w=window.open('','_blank');
  if(!w){ toast('瀏覽器阻擋了新視窗，請允許彈出視窗', false); return; }
  w.document.write('<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>'+title+
   '</title><style>body{font-family:"Microsoft JhengHei",sans-serif;padding:24px;line-height:1.9;color:#4A3E3D}'+
   'h2{border-bottom:3px solid #7DD3FC;padding-bottom:6px}.sig{margin-top:36px;border-top:1px dashed #999;padding-top:12px}</style></head><body>'+
   '<h2>'+title+'</h2>'+html+
   '<div class="sig">班級：____________　座號：____________　姓名：____________　日期：____________</div></body></html>');
  w.document.close();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 400);
}
function collectAnswers(panel){
  var lines=[], cards=[].slice.call(panel.querySelectorAll('.card'));
  cards.forEach(function(c){
    if(c.querySelector('.sub-title') && /練習成果繳交/.test(c.querySelector('.sub-title').textContent)) return;
    var num=c.querySelector('.num')?c.querySelector('.num').textContent.trim():'';
    var parts=[];
    [].slice.call(c.querySelectorAll('input.blank')).forEach(function(ip){ if(ip.value.trim())parts.push(ip.value.trim()); });
    [].slice.call(c.querySelectorAll('.eblank')).forEach(function(b){ if(b.textContent.trim())parts.push(b.textContent.trim()); });
    [].slice.call(c.querySelectorAll('select.blank')).forEach(function(se){ if(se.value>-1&&se.selectedIndex>0)parts.push(se.options[se.selectedIndex].text.trim()); });
    [].slice.call(c.querySelectorAll('textarea.ta')).forEach(function(t){ if(t.value.trim())parts.push(t.value.trim()); });
    var picked=c.querySelector('.mcopt.sel')||c.querySelector('.mcopt.ok');
    if(picked) parts.push(picked.textContent.trim());
    [].slice.call(c.querySelectorAll('.slot.filled')).forEach(function(sl){ parts.push(sl.textContent.replace(/\s+/g,' ').trim()); });
    var fbn=c.querySelector('.fb.on');
    var res=fbn?('　→ '+fbn.textContent.replace(/\s+/g,' ').trim()):'';
    if(parts.length) lines.push((num?('['+num+'] '):'')+parts.join('｜')+res);
  });
  return lines.length?lines.join('\n'):'（本頁尚未作答，請先完成練習再複製或列印。）';
}
function submitHeader(label){

    '🏆 累計總分：'+TOTAL+' 分　｜　本輪得分：'+ROUND+' / 2000\n'+
    '完成時間：'+new Date().toLocaleString()+'\n------------------------------\n';
}

      '依上表快捷鍵截圖。<br>打開 Google Classroom 對應課程。<br>進入本次作業，點選【新增或建立】→【檔案】。<br>'+
      '上傳截圖或本檔案，檔名格式：班級_座號_姓名_L1_第○輪。<br>按【繳交】並在留言區貼上你的練習紀錄。</p>');
  };
  var b3=el('button','btn','👀 預覽本輪紀錄');
  var box=el('div','reveal');
  b3.onclick=function(){ box.classList.add('on');
    box.innerHTML='<div class="ansline">👀 本輪作答紀錄預覽</div><div class="expl" style="white-space:pre-wrap">'+
      esc(submitHeader(label)+collectAnswers(root))+'</div>'; };

function collapseNotices(){
  var nodes=[].slice.call(document.querySelectorAll('.panel .rulebar, .panel .intro'));
  nodes.forEach(function(nd){
    if(nd.dataset.collapsed)return;
    nd.dataset.collapsed='1';
    var isRule=nd.classList.contains('rulebar');
    var label=isRule?'⚖️ 計分規則':'💡 本頁說明';
    var btn=el('button','btn mini',label+'（按一下展開）');
    btn.style.margin='6px 6px 0 0';
    nd.style.display='none';
    nd.parentNode.insertBefore(btn,nd);
    btn.onclick=function(){
      var on=nd.style.display==='none';
      nd.style.display=on?'block':'none';
      btn.textContent=label+(on?'（按一下隱藏）':'（按一下展開）');
    };
  });
}
